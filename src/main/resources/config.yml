# ============================================
#  HeartPlugin 配置文件
# ============================================

# 一颗心对应的生命值点数（游戏内一颗心 = 2 点生命）
heart-hp: 2.0

# 玩家至少要有该数量的心，才能用 /heart 把心送给他人
min-hearts: 1

# 吃“心”苹果能达到的最大心数，-1 表示无上限
max-hearts: -1

# /heart 命令的冷却时间（秒），0 = 无冷却
heart-cooldown: 0

# 玩家死亡时是否扣除并掉落心
# 注意：不会跌破 min-hearts 设置的最少心数
death-heart-drop:
  enabled: true
  # 每次死亡扣除并掉落的心数
  heart-count: 1

# 显示语言：
#   auto   = 跟随每个玩家客户端语言（已内置 zh_cn、en_us）
#   指定代码 = 所有玩家统一使用该语言，如 zh_cn / en_us
language: auto